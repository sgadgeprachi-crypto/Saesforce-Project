<template>
 
   <lightning-card title="Account Information" icon-name="standard:account">
        <div class="slds-p-around_medium">
            <!-- Replace 'Account' with your Object API Name if using a Custom Object -->
            <lightning-record-edit-form 
                object-api-name="Customer_Info__c"
                onsuccess={handleSuccess}
                onerror={handleError}>
                
                <lightning-messages></lightning-messages>

                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_small">
                        <!-- Standard Name field -->
                       
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_small">
                        <!-- Replace 'PAN_Number__c' with your actual Custom Field API Name -->
                        <lightning-input-field field-name="PAN_Number__c"></lightning-input-field>
                    </div>
                </div>

                <div class="slds-m-top_medium slds-p-horizontal_small">
                    <lightning-button 
                        variant="brand" 
                        type="submit" 
                        label="Save Record">
                    </lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
 </lightning-card>
</template>
